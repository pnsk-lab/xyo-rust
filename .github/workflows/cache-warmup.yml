name: Cache Warmup

env:
    LLVM_VERSION: 21.1.8
    LLVM_CACHE_VERSION: v2

on:
    schedule:
        - cron: "0 0 */5 * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    warm-cache:
        name: Warm Cache (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: ubuntu-latest
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm
                    - os: macos-latest
                      label: macos-latest
                      llvm_targets: X86;AArch64;WebAssembly
                      llvm_cache_targets: x86-aarch64-wasm
                    - os: windows-latest
                      label: windows-latest-x64
                      cmake_arch: x64
                      llvm_targets: X86;AArch64;WebAssembly
                      llvm_cache_targets: x86-aarch64-wasm
                    - os: windows-11-arm
                      label: windows-11-arm64
                      cmake_arch: ARM64
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache LLVM 21.1.x
              id: cache-llvm
              uses: actions/cache@v4
              with:
                  path: .llvm/${{ runner.os }}-${{ runner.arch }}
                  key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_VERSION }}-${{ matrix.llvm_cache_targets }}-${{ env.LLVM_CACHE_VERSION }}

            - name: Build LLVM 21.1.x (Unix)
              if: runner.os != 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euxo pipefail
                  LLVM_INSTALL_DIR="$GITHUB_WORKSPACE/.llvm/${RUNNER_OS}-${RUNNER_ARCH}"
                  LLVM_SOURCE_DIR="$RUNNER_TEMP/llvm-project"
                  LLVM_BUILD_DIR="$RUNNER_TEMP/llvm-build"
                  rm -rf "$LLVM_INSTALL_DIR" "$LLVM_SOURCE_DIR" "$LLVM_BUILD_DIR"
                  git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git "$LLVM_SOURCE_DIR"
                  cmake -S "$LLVM_SOURCE_DIR/llvm" -B "$LLVM_BUILD_DIR" -G Ninja \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_INSTALL_PREFIX="$LLVM_INSTALL_DIR" \
                      -DLLVM_TARGETS_TO_BUILD="${{ matrix.llvm_targets }}" \
                      -DLLVM_INCLUDE_TESTS=OFF \
                      -DLLVM_INCLUDE_BENCHMARKS=OFF \
                      -DLLVM_INCLUDE_EXAMPLES=OFF \
                      -DLLVM_BUILD_LLVM_DYLIB=OFF \
                      -DBUILD_SHARED_LIBS=OFF
                  cmake --build "$LLVM_BUILD_DIR" --target install --parallel

            - name: Build LLVM 21.1.x (Windows)
              if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  $llvmInstallDir = Join-Path $env:GITHUB_WORKSPACE ".llvm\$($env:RUNNER_OS)-$($env:RUNNER_ARCH)"
                  $llvmSourceDir = Join-Path $env:RUNNER_TEMP 'llvm-project'
                  $llvmBuildDir = Join-Path $env:RUNNER_TEMP 'llvm-build'
                  if (Test-Path $llvmInstallDir) {
                    Remove-Item $llvmInstallDir -Recurse -Force
                  }
                  if (Test-Path $llvmSourceDir) {
                    Remove-Item $llvmSourceDir -Recurse -Force
                  }
                  if (Test-Path $llvmBuildDir) {
                    Remove-Item $llvmBuildDir -Recurse -Force
                  }
                  git clone --depth 1 --branch "llvmorg-$env:LLVM_VERSION" https://github.com/llvm/llvm-project.git $llvmSourceDir
                  cmake -S "$llvmSourceDir\llvm" -B $llvmBuildDir -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$llvmInstallDir" -DLLVM_TARGETS_TO_BUILD="${{ matrix.llvm_targets }}" -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_BUILD_LLVM_DYLIB=OFF -DBUILD_SHARED_LIBS=OFF
                  cmake --build $llvmBuildDir --config Release --target INSTALL -- /m

            - name: Export LLVM env (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  LLVM_ROOT="$GITHUB_WORKSPACE/.llvm/${RUNNER_OS}-${RUNNER_ARCH}"
                  echo "LLVM_SYS_211_PREFIX=$LLVM_ROOT" >> "$GITHUB_ENV"
                  echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"

            - name: Export LLVM env (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $llvmRoot = Join-Path $env:GITHUB_WORKSPACE ".llvm\$($env:RUNNER_OS)-$($env:RUNNER_ARCH)"
                  "LLVM_SYS_211_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
