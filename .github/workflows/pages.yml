name: Publish Docs

on:
    push:
        paths:
            - README.md
            - docs/**
            - .github/workflows/pages.yml
    workflow_dispatch:
    release:
        types:
            - published

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: Build Pages Artifact
        if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Download Taiga
              working-directory: docs
              run: |
                  curl -L --fail --retry 3 \
                      -o taiga \
                      https://j.nishi.boats/job/pyrite-dev/job/taiga/job/master/lastSuccessfulBuild/artifact/taiga-linux64
                  chmod +x taiga

            - name: Generate Taiga XML from Markdown
              working-directory: docs
              run: ./taiga markdown-dir

            - name: Build site with Taiga
              working-directory: docs
              run: |
                  rm -rf build
                  ./taiga site

            - name: Upload generated site
              uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/build

    deploy:
        name: Deploy to GitHub Pages
        if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v4
