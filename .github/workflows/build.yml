name: build

on:
    push:
    pull_request:

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc

                    # 安定化後に戻す（必要なら最後に有効化）
                    # - name: windows-arm64
                    #   os: windows-latest
                    #   target: aarch64-pc-windows-msvc

                    - name: macos-arm64
                      os: macos-14
                      target: aarch64-apple-darwin

                    - name: linux-x86_64
                      os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu

                    - name: linux-arm64
                      os: ubuntu-22.04
                      target: aarch64-unknown-linux-gnu

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            # ---------------- Linux: LLVM 18 + cross deps ----------------
            - name: Install LLVM 18 (Linux)
              if: ${{ startsWith(matrix.os, 'ubuntu') }}
              shell: bash
              run: |
                  set -euxo pipefail
                  sudo apt-get update
                  sudo apt-get install -y wget gpg lsb-release software-properties-common
                  wget -q https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh 18
                  /usr/bin/llvm-config-18 --version

                  if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
                    sudo apt-get install -y \
                      gcc-aarch64-linux-gnu \
                      g++-aarch64-linux-gnu \
                      binutils-aarch64-linux-gnu \
                      libc6-dev-arm64-cross
                  fi

            # ---------------- macOS: LLVM 18 ----------------
            - name: Install LLVM 18 (macOS)
              if: ${{ startsWith(matrix.os, 'macos') }}
              shell: bash
              run: |
                  set -euxo pipefail
                  brew update
                  brew install llvm@18
                  /opt/homebrew/opt/llvm@18/bin/llvm-config --version

            # ---------------- Windows: LLVM 18 ----------------
            - name: Install LLVM 18 (Windows)
              if: ${{ startsWith(matrix.os, 'windows') }}
              shell: pwsh
              run: |
                  choco install llvm --version=18.1.8 --allow-downgrade -y --no-progress

                  $llvmConfig = "C:\Program Files\LLVM\bin\llvm-config.exe"
                  if (-not (Test-Path $llvmConfig)) {
                    $llvmConfig = "C:\Program Files (x86)\LLVM\bin\llvm-config.exe"
                  }
                  if (-not (Test-Path $llvmConfig)) {
                    throw "llvm-config.exe not found"
                  }

                  $llvmPrefix = Split-Path (Split-Path $llvmConfig -Parent) -Parent

                  "LLVM_CONFIG_PATH=$llvmConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "LLVM_SYS_181_PREFIX=$llvmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

                  & $llvmConfig --version

            # ---------------- Build: Linux ----------------
            - name: Build (Linux)
              if: ${{ startsWith(matrix.os, 'ubuntu') }}
              shell: bash
              env:
                  LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
                  LLVM_CONFIG_PATH: /usr/bin/llvm-config-18
                  LLVM_LINK_LLVM_DYLIB: "1"
                  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
                  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
                  CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
              run: |
                  set -euxo pipefail
                  export PATH="/usr/lib/llvm-18/bin:$PATH"

                  # runner 汚染除去
                  unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CC CXX AR RUSTFLAGS CARGO_ENCODED_RUSTFLAGS || true

                  cargo --version
                  "$LLVM_CONFIG_PATH" --version
                  if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
                    aarch64-linux-gnu-gcc -v
                  fi

                  cargo clean -p llvm-sys || true
                  cargo build --release --target ${{ matrix.target }} -vv

            # ---------------- Build: macOS ----------------
            - name: Build (macOS)
              if: ${{ startsWith(matrix.os, 'macos') }}
              shell: bash
              env:
                  LLVM_SYS_181_PREFIX: /opt/homebrew/opt/llvm@18
                  LLVM_CONFIG_PATH: /opt/homebrew/opt/llvm@18/bin/llvm-config
                  LLVM_LINK_LLVM_DYLIB: "1"
              run: |
                  set -euxo pipefail
                  export PATH="/opt/homebrew/opt/llvm@18/bin:$PATH"

                  # runner 汚染除去
                  unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CC CXX AR RUSTFLAGS CARGO_ENCODED_RUSTFLAGS || true

                  cargo --version
                  "$LLVM_CONFIG_PATH" --version

                  cargo clean -p llvm-sys || true
                  cargo build --release --target ${{ matrix.target }} -vv

            # ---------------- Build: Windows ----------------
            - name: Build (Windows)
              if: ${{ startsWith(matrix.os, 'windows') }}
              shell: pwsh
              env:
                  LLVM_LINK_LLVM_DYLIB: "1"
              run: |
                  if (-not $env:LLVM_CONFIG_PATH) { throw "LLVM_CONFIG_PATH is empty" }
                  if (-not $env:LLVM_SYS_181_PREFIX) { throw "LLVM_SYS_181_PREFIX is empty" }

                  $llvmBin = Split-Path $env:LLVM_CONFIG_PATH -Parent
                  $env:Path = "$llvmBin;$env:Path"

                  # ---- 汚染環境変数を徹底除去 ----
                  foreach ($k in @(
                    "CFLAGS","CXXFLAGS","CPPFLAGS","LDFLAGS",
                    "CC","CXX","AR",
                    "TARGET_CFLAGS","HOST_CFLAGS",
                    "CFLAGS_x86_64_pc_windows_msvc","CFLAGS_x86_64-pc-windows-msvc",
                    "CFLAGS_aarch64_pc_windows_msvc","CFLAGS_aarch64-pc-windows-msvc",
                    "CRATE_CC_NO_DEFAULTS",
                    "RUSTFLAGS","CARGO_ENCODED_RUSTFLAGS",
                    "BINDGEN_EXTRA_CLANG_ARGS"
                  )) {
                    Remove-Item -Path "Env:$k" -ErrorAction SilentlyContinue
                  }

                  # 念のため空で明示（'-' を含む名前は Set-Item）
                  Set-Item -Path Env:'CFLAGS_x86_64-pc-windows-msvc' -Value ''
                  Set-Item -Path Env:'CFLAGS_x86_64_pc_windows_msvc' -Value ''
                  Set-Item -Path Env:'CFLAGS_aarch64-pc-windows-msvc' -Value ''
                  Set-Item -Path Env:'CFLAGS_aarch64_pc_windows_msvc' -Value ''

                  # llvm-sys が参照する値を明示
                  $env:LLVM_SYS_181_PREFIX = $env:LLVM_SYS_181_PREFIX
                  $env:LLVM_CONFIG_PATH = $env:LLVM_CONFIG_PATH

                  cargo --version
                  & $env:LLVM_CONFIG_PATH --version

                  # ヘッダ存在確認
                  $targetHeader = Join-Path $env:LLVM_SYS_181_PREFIX "include\llvm-c\Target.h"
                  if (-not (Test-Path $targetHeader)) {
                    throw "LLVM header not found: $targetHeader"
                  }

                  cargo clean -p llvm-sys
                  cargo build --release --target ${{ matrix.target }} -vv

            - name: Upload artifact (Unix)
              if: ${{ !startsWith(matrix.os, 'windows') }}
              uses: actions/upload-artifact@v4
              with:
                  name: scratch-native-runtime-${{ matrix.target }}
                  path: target/${{ matrix.target }}/release/scratch-native-runtime*
                  if-no-files-found: error

            - name: Upload artifact (Windows)
              if: ${{ startsWith(matrix.os, 'windows') }}
              uses: actions/upload-artifact@v4
              with:
                  name: scratch-native-runtime-${{ matrix.target }}
                  path: |
                      target/${{ matrix.target }}/release/scratch-native-runtime*.exe
                      target/${{ matrix.target }}/release/scratch-native-runtime*.pdb
                  if-no-files-found: error
