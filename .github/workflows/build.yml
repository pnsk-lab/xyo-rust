name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21.1.x
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1"
          directory: ${{ runner.temp }}/llvm

      - name: Export LLVM env
        shell: bash
        run: |
          echo "LLVM_SYS_211_PREFIX=$LLVM_PATH" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PATH/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PATH/bin" >> "$GITHUB_PATH"

      - name: Verify LLVM version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$LLVM_PATH/bin/llvm-config" --version

      - name: Verify LLVM version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:LLVM_PATH\bin\llvm-config.exe" --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose
