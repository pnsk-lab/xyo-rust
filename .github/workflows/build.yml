name: build

on:
    push:
    pull_request:

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                    - name: windows-arm64
                      os: windows-latest
                      target: aarch64-pc-windows-msvc
                    - name: macos-arm64
                      os: macos-14
                      target: aarch64-apple-darwin
                    - name: linux-x86_64
                      os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - name: linux-arm64
                      os: ubuntu-22.04
                      target: aarch64-unknown-linux-gnu

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install Linux cross toolchain
              if: ${{ startsWith(matrix.target, 'aarch64-unknown-linux-gnu') }}
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu

            - name: Build
              shell: bash
              run: cargo build --release --target ${{ matrix.target }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: scratch-native-runtime-${{ matrix.target }}
                  path: target/${{ matrix.target }}/release/scratch-native-runtime*
                  if-no-files-found: error
