name: Build

env:
    LLVM_VERSION: 21.1.8
    LLVM_CACHE_VERSION: v4
    ICU_VERSION: 78.3
    ICU_CACHE_VERSION: v1

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    build:
        name: Build (${{ matrix.rust_target }})
        runs-on: ${{ matrix.os }}
        env:
            CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
            XYO_RELEASE_TARGET: ${{ matrix.rust_target }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      rust_target: x86_64-unknown-linux-gnu
                      artifact_path: target/release/xyo-x86_64-unknown-linux-gnu.tar.gz
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm
                    - os: ubuntu-24.04
                      rust_target: x86_64-unknown-linux-musl
                      artifact_path: target/release/xyo-x86_64-unknown-linux-musl.tar.gz
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm
                    - os: ubuntu-24.04-arm
                      rust_target: aarch64-unknown-linux-gnu
                      artifact_path: target/release/xyo-aarch64-unknown-linux-gnu.tar.gz
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm
                    - os: macos-15-intel
                      rust_target: x86_64-apple-darwin
                      artifact_path: target/release/xyo-x86_64-apple-darwin
                      llvm_targets: X86;AArch64;WebAssembly
                      llvm_cache_targets: x86-aarch64-wasm
                    - os: macos-15
                      rust_target: aarch64-apple-darwin
                      artifact_path: target/release/xyo-aarch64-apple-darwin
                      llvm_targets: X86;AArch64;WebAssembly
                      llvm_cache_targets: x86-aarch64-wasm
                    - os: windows-latest
                      rust_target: x86_64-pc-windows-msvc
                      artifact_path: target/release/xyo-x86_64-pc-windows-msvc.zip
                      cmake_arch: x64
                      vcpkg_triplet: x64-windows
                      llvm_targets: X86;AArch64;WebAssembly
                      llvm_cache_targets: x86-aarch64-wasm
                    - os: windows-11-arm
                      rust_target: aarch64-pc-windows-msvc
                      artifact_path: target/release/xyo-aarch64-pc-windows-msvc.zip
                      cmake_arch: ARM64
                      vcpkg_triplet: arm64-windows
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Add Rust target
              run: rustup target add ${{ matrix.rust_target }}

            - name: Setup Zig for musl
              if: matrix.rust_target == 'x86_64-unknown-linux-musl'
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.14.1

            - name: Configure musl toolchain
              if: matrix.rust_target == 'x86_64-unknown-linux-musl'
              shell: bash
              run: |
                  set -euxo pipefail
                  mkdir -p "$RUNNER_TEMP/zig-musl-bin"
                  cat > "$RUNNER_TEMP/zig-musl-bin/zig-musl-cc" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  args=()
                  while [[ $# -gt 0 ]]; do
                      case "$1" in
                      --target=x86_64-unknown-linux-musl|-target=x86_64-unknown-linux-musl)
                          shift
                          ;;
                      --target|-target)
                          if [[ "${2:-}" == "x86_64-unknown-linux-musl" ]]; then
                              shift 2
                          else
                              args+=("$1")
                              shift
                          fi
                          ;;
                      *)
                          args+=("$1")
                          shift
                          ;;
                      esac
                  done

                  exec zig cc -target x86_64-linux-musl "${args[@]}"
                  EOF
                  cat > "$RUNNER_TEMP/zig-musl-bin/zig-musl-c++" <<'EOF'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  args=()
                  while [[ $# -gt 0 ]]; do
                      case "$1" in
                      --target=x86_64-unknown-linux-musl|-target=x86_64-unknown-linux-musl)
                          shift
                          ;;
                      --target|-target)
                          if [[ "${2:-}" == "x86_64-unknown-linux-musl" ]]; then
                              shift 2
                          else
                              args+=("$1")
                              shift
                          fi
                          ;;
                      *)
                          args+=("$1")
                          shift
                          ;;
                      esac
                  done

                  exec zig c++ -target x86_64-linux-musl "${args[@]}"
                  EOF
                  chmod +x "$RUNNER_TEMP/zig-musl-bin/zig-musl-cc" "$RUNNER_TEMP/zig-musl-bin/zig-musl-c++"
                  echo "XYO_CMAKE_C_COMPILER=$RUNNER_TEMP/zig-musl-bin/zig-musl-cc" >> "$GITHUB_ENV"
                  echo "XYO_CMAKE_CXX_COMPILER=$RUNNER_TEMP/zig-musl-bin/zig-musl-c++" >> "$GITHUB_ENV"
                  echo "CC_x86_64_unknown_linux_musl=$RUNNER_TEMP/zig-musl-bin/zig-musl-cc" >> "$GITHUB_ENV"
                  echo "CXX_x86_64_unknown_linux_musl=$RUNNER_TEMP/zig-musl-bin/zig-musl-c++" >> "$GITHUB_ENV"
                  echo "CLANG=$RUNNER_TEMP/zig-musl-bin/zig-musl-cc" >> "$GITHUB_ENV"
                  echo "CLANGXX=$RUNNER_TEMP/zig-musl-bin/zig-musl-c++" >> "$GITHUB_ENV"
                  echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$RUNNER_TEMP/zig-musl-bin/zig-musl-cc" >> "$GITHUB_ENV"

            - name: Cache LLVM 21.1.x
              id: cache-llvm
              uses: actions/cache@v4
              with:
                  path: .llvm/${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}
                  key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ env.LLVM_VERSION }}-${{ matrix.llvm_cache_targets }}-${{ env.LLVM_CACHE_VERSION }}

            - name: Cache ICU prebuilt (Unix)
              if: runner.os != 'Windows'
              id: cache-icu-prebuilt-unix
              uses: actions/cache@v4
              with:
                  path: |
                      bitcodes/c/lib/icu
                      bitcodes/c/lib/icu-prebuilt
                      target/icu-prebuilt-build
                  key: icu-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ env.ICU_VERSION }}-${{ env.ICU_CACHE_VERSION }}

            - name: Cache ICU prebuilt (Windows)
              if: runner.os == 'Windows'
              id: cache-icu-prebuilt-windows
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/vcpkg
                  key: icu-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.vcpkg_triplet }}-${{ env.ICU_VERSION }}-${{ env.ICU_CACHE_VERSION }}

            - name: Build LLVM 21.1.x (Unix)
              if: runner.os != 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euxo pipefail
                  LLVM_INSTALL_DIR="$GITHUB_WORKSPACE/.llvm/${RUNNER_OS}-${RUNNER_ARCH}-${{ matrix.rust_target }}"
                  LLVM_SOURCE_DIR="$RUNNER_TEMP/llvm-project"
                  LLVM_BUILD_DIR="$RUNNER_TEMP/llvm-build"
                  rm -rf "$LLVM_INSTALL_DIR" "$LLVM_SOURCE_DIR" "$LLVM_BUILD_DIR"
                  git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git "$LLVM_SOURCE_DIR"
                  cmake_args=(
                      -DCMAKE_BUILD_TYPE=Release
                      -DCMAKE_INSTALL_PREFIX="$LLVM_INSTALL_DIR"
                      -DLLVM_TARGETS_TO_BUILD="${{ matrix.llvm_targets }}"
                      -DLLVM_INCLUDE_TESTS=OFF
                      -DLLVM_INCLUDE_BENCHMARKS=OFF
                      -DLLVM_INCLUDE_EXAMPLES=OFF
                      -DLLVM_BUILD_LLVM_DYLIB=OFF
                      -DBUILD_SHARED_LIBS=OFF
                      -DLLVM_ENABLE_FFI=OFF
                      -DLLVM_ENABLE_LIBXML2=OFF
                      -DLLVM_ENABLE_ZSTD=OFF
                      -DLLVM_ENABLE_TERMINFO=OFF
                  )
                  if [[ -n "${XYO_CMAKE_C_COMPILER:-}" ]]; then
                      cmake_args+=(
                          -DCMAKE_C_COMPILER="$XYO_CMAKE_C_COMPILER"
                          -DCMAKE_CXX_COMPILER="$XYO_CMAKE_CXX_COMPILER"
                      )
                  fi
                  cmake -S "$LLVM_SOURCE_DIR/llvm" -B "$LLVM_BUILD_DIR" -G Ninja \
                      "${cmake_args[@]}"
                  cmake --build "$LLVM_BUILD_DIR" --target install --parallel

            - name: Build LLVM 21.1.x (Windows)
              if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  $llvmInstallDir = Join-Path $env:GITHUB_WORKSPACE ".llvm\$($env:RUNNER_OS)-$($env:RUNNER_ARCH)-${{ matrix.rust_target }}"
                  $llvmSourceDir = Join-Path $env:RUNNER_TEMP 'llvm-project'
                  $llvmBuildDir = Join-Path $env:RUNNER_TEMP 'llvm-build'
                  if (Test-Path $llvmInstallDir) {
                    Remove-Item $llvmInstallDir -Recurse -Force
                  }
                  if (Test-Path $llvmSourceDir) {
                    Remove-Item $llvmSourceDir -Recurse -Force
                  }
                  if (Test-Path $llvmBuildDir) {
                    Remove-Item $llvmBuildDir -Recurse -Force
                  }
                  git clone --depth 1 --branch "llvmorg-$env:LLVM_VERSION" https://github.com/llvm/llvm-project.git $llvmSourceDir
                  cmake -S "$llvmSourceDir\llvm" -B $llvmBuildDir -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$llvmInstallDir" -DLLVM_TARGETS_TO_BUILD="${{ matrix.llvm_targets }}" -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_BUILD_LLVM_DYLIB=OFF -DBUILD_SHARED_LIBS=OFF
                  cmake --build $llvmBuildDir --config Release --target INSTALL -- /m

            - name: Export LLVM env (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  LLVM_ROOT="$GITHUB_WORKSPACE/.llvm/${RUNNER_OS}-${RUNNER_ARCH}-${{ matrix.rust_target }}"
                  echo "LLVM_SYS_211_PREFIX=$LLVM_ROOT" >> "$GITHUB_ENV"
                  echo "LLVM_CONFIG_PATH=$LLVM_ROOT/bin/llvm-config" >> "$GITHUB_ENV"
                  echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"

            - name: Export LLVM env (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $llvmRoot = Join-Path $env:GITHUB_WORKSPACE ".llvm\$($env:RUNNER_OS)-$($env:RUNNER_ARCH)-${{ matrix.rust_target }}"
                  "LLVM_SYS_211_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "LLVM_CONFIG_PATH=$llvmRoot\bin\llvm-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Verify LLVM version (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  "$LLVM_CONFIG_PATH" --version
                  "$LLVM_CONFIG_PATH" --system-libs --link-static
                  if [[ "${{ matrix.rust_target }}" == "x86_64-unknown-linux-musl" ]] && "$LLVM_CONFIG_PATH" --system-libs --link-static | grep -Eq '(^|[[:space:]])-lffi($|[[:space:]])'; then
                      echo "musl LLVM cache was built with libffi enabled; bump LLVM_CACHE_VERSION or rebuild LLVM with LLVM_ENABLE_FFI=OFF" >&2
                      exit 1
                  fi

            - name: Verify LLVM version (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  & "$env:LLVM_CONFIG_PATH" --version

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Setup and build (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  if [[ "${{ steps.cache-icu-prebuilt-unix.outputs.cache-hit }}" == "true" ]]; then
                      ./setup.sh
                  else
                      ./setup.sh --clean-icu
                  fi

            - name: Cache ICU runtime (Linux)
              if: runner.os == 'Linux'
              id: cache-icu-runtime
              uses: actions/cache@v4
              with:
                  path: |
                      target/icu-runtime
                      target/icu-runtime-build
                  key: icu-runtime-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ env.ICU_VERSION }}-${{ env.ICU_CACHE_VERSION }}

            - name: Build bundled ICU runtime (Linux)
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  if [[ "${{ steps.cache-icu-runtime.outputs.cache-hit }}" == "true" ]]; then
                      ./tools/build_icu_runtime.sh
                  else
                      ./tools/build_icu_runtime.sh --clean
                  fi

            - name: Package release artifact (Linux)
              if: runner.os == 'Linux'
              shell: bash
              env:
                  XYO_RELEASE_BIN: target/${{ matrix.rust_target }}/release/xyo
              run: |
                  ./tools/package_release_linux.sh

            - name: Package release artifact (macOS)
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  mkdir -p target/release
                  install -m 0755 "target/${{ matrix.rust_target }}/release/xyo" "${{ matrix.artifact_path }}"

            - name: Setup and build (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  if ("${{ steps.cache-icu-prebuilt-windows.outputs.cache-hit }}" -eq "true") {
                    ./setup.ps1 -SkipCheck -VcpkgTriplet "${{ matrix.vcpkg_triplet }}"
                  } else {
                    ./setup.ps1 -CleanIcu -SkipCheck -VcpkgTriplet "${{ matrix.vcpkg_triplet }}"
                  }

            - name: Package release artifact (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  XYO_RELEASE_BIN: target/${{ matrix.rust_target }}/release/xyo.exe
              run: |
                  ./tools/package_release_windows.ps1

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: xyo-${{ matrix.rust_target }}
                  path: ${{ matrix.artifact_path }}
                  if-no-files-found: error

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: xyo-*
                  path: ./artifacts
                  merge-multiple: true

            - name: Create GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG_NAME=${GITHUB_REF#refs/tags/}
                  gh release create "$TAG_NAME" ./artifacts/xyo-* --title "$TAG_NAME" --notes "Automated release for $TAG_NAME"
