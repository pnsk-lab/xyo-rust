name: Build

env:
    LLVM_VERSION: 21.1.8
    LLVM_CACHE_VERSION: v2
    ICU_VERSION: 78.3
    ICU_CACHE_VERSION: v1

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    build:
        name: Build (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: ubuntu-latest
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm
                    - os: macos-latest
                      label: macos-latest
                      llvm_targets: X86;AArch64;WebAssembly
                      llvm_cache_targets: x86-aarch64-wasm
                    - os: windows-latest
                      label: windows-latest-x64
                      cmake_arch: x64
                      vcpkg_triplet: x64-windows
                      llvm_targets: X86;AArch64;WebAssembly
                      llvm_cache_targets: x86-aarch64-wasm
                    - os: windows-11-arm
                      label: windows-11-arm64
                      cmake_arch: ARM64
                      vcpkg_triplet: arm64-windows
                      llvm_targets: X86;AArch64;RISCV;WebAssembly
                      llvm_cache_targets: x86-aarch64-riscv-wasm

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache LLVM 21.1.x
              id: cache-llvm
              uses: actions/cache@v4
              with:
                  path: .llvm/${{ runner.os }}-${{ runner.arch }}
                  key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_VERSION }}-${{ matrix.llvm_cache_targets }}-${{ env.LLVM_CACHE_VERSION }}

            - name: Cache ICU prebuilt (Unix)
              if: runner.os != 'Windows'
              id: cache-icu-prebuilt-unix
              uses: actions/cache@v4
              with:
                  path: |
                      bitcodes/c/lib/icu
                      bitcodes/c/lib/icu-prebuilt
                      target/icu-prebuilt-build
                  key: icu-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ env.ICU_VERSION }}-${{ env.ICU_CACHE_VERSION }}

            - name: Cache ICU prebuilt (Windows)
              if: runner.os == 'Windows'
              id: cache-icu-prebuilt-windows
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/vcpkg
                  key: icu-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.vcpkg_triplet }}-${{ env.ICU_VERSION }}-${{ env.ICU_CACHE_VERSION }}

            - name: Build LLVM 21.1.x (Unix)
              if: runner.os != 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euxo pipefail
                  LLVM_INSTALL_DIR="$GITHUB_WORKSPACE/.llvm/${RUNNER_OS}-${RUNNER_ARCH}"
                  LLVM_SOURCE_DIR="$RUNNER_TEMP/llvm-project"
                  LLVM_BUILD_DIR="$RUNNER_TEMP/llvm-build"
                  rm -rf "$LLVM_INSTALL_DIR" "$LLVM_SOURCE_DIR" "$LLVM_BUILD_DIR"
                  git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git "$LLVM_SOURCE_DIR"
                  cmake -S "$LLVM_SOURCE_DIR/llvm" -B "$LLVM_BUILD_DIR" -G Ninja \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_INSTALL_PREFIX="$LLVM_INSTALL_DIR" \
                      -DLLVM_TARGETS_TO_BUILD="${{ matrix.llvm_targets }}" \
                      -DLLVM_INCLUDE_TESTS=OFF \
                      -DLLVM_INCLUDE_BENCHMARKS=OFF \
                      -DLLVM_INCLUDE_EXAMPLES=OFF \
                      -DLLVM_BUILD_LLVM_DYLIB=OFF \
                      -DBUILD_SHARED_LIBS=OFF
                  cmake --build "$LLVM_BUILD_DIR" --target install --parallel

            - name: Build LLVM 21.1.x (Windows)
              if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  $llvmInstallDir = Join-Path $env:GITHUB_WORKSPACE ".llvm\$($env:RUNNER_OS)-$($env:RUNNER_ARCH)"
                  $llvmSourceDir = Join-Path $env:RUNNER_TEMP 'llvm-project'
                  $llvmBuildDir = Join-Path $env:RUNNER_TEMP 'llvm-build'
                  if (Test-Path $llvmInstallDir) {
                    Remove-Item $llvmInstallDir -Recurse -Force
                  }
                  if (Test-Path $llvmSourceDir) {
                    Remove-Item $llvmSourceDir -Recurse -Force
                  }
                  if (Test-Path $llvmBuildDir) {
                    Remove-Item $llvmBuildDir -Recurse -Force
                  }
                  git clone --depth 1 --branch "llvmorg-$env:LLVM_VERSION" https://github.com/llvm/llvm-project.git $llvmSourceDir
                  cmake -S "$llvmSourceDir\llvm" -B $llvmBuildDir -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$llvmInstallDir" -DLLVM_TARGETS_TO_BUILD="${{ matrix.llvm_targets }}" -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_BUILD_LLVM_DYLIB=OFF -DBUILD_SHARED_LIBS=OFF
                  cmake --build $llvmBuildDir --config Release --target INSTALL -- /m

            - name: Export LLVM env (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  LLVM_ROOT="$GITHUB_WORKSPACE/.llvm/${RUNNER_OS}-${RUNNER_ARCH}"
                  echo "LLVM_SYS_211_PREFIX=$LLVM_ROOT" >> "$GITHUB_ENV"
                  echo "LLVM_CONFIG_PATH=$LLVM_ROOT/bin/llvm-config" >> "$GITHUB_ENV"
                  echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"

            - name: Export LLVM env (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $llvmRoot = Join-Path $env:GITHUB_WORKSPACE ".llvm\$($env:RUNNER_OS)-$($env:RUNNER_ARCH)"
                  "LLVM_SYS_211_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "LLVM_CONFIG_PATH=$llvmRoot\bin\llvm-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Verify LLVM version (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  "$LLVM_CONFIG_PATH" --version

            - name: Verify LLVM version (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  & "$env:LLVM_CONFIG_PATH" --version

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Setup and build (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  if [[ "${{ steps.cache-icu-prebuilt-unix.outputs.cache-hit }}" == "true" ]]; then
                      ./setup.sh
                  else
                      ./setup.sh --clean-icu
                  fi

            - name: Cache ICU runtime (Linux)
              if: runner.os == 'Linux'
              id: cache-icu-runtime
              uses: actions/cache@v4
              with:
                  path: |
                      target/icu-runtime
                      target/icu-runtime-build
                  key: icu-runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.ICU_VERSION }}-${{ env.ICU_CACHE_VERSION }}

            - name: Build bundled ICU runtime (Linux)
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  if [[ "${{ steps.cache-icu-runtime.outputs.cache-hit }}" == "true" ]]; then
                      ./tools/build_icu_runtime.sh
                  else
                      ./tools/build_icu_runtime.sh --clean
                  fi

            - name: Package release artifact (Linux)
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  ./tools/package_release_linux.sh

            - name: Setup and build (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  if ("${{ steps.cache-icu-prebuilt-windows.outputs.cache-hit }}" -eq "true") {
                    ./setup.ps1 -SkipCheck
                  } else {
                    ./setup.ps1 -CleanIcu -SkipCheck
                  }

            - name: Package release artifact (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  ./tools/package_release_windows.ps1

            - name: Upload artifact (Linux)
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                  name: xyo-${{ matrix.label }}
                  path: target/release/xyo-linux.tar.gz
                  if-no-files-found: error

            - name: Upload artifact (macOS)
              if: runner.os == 'macOS'
              uses: actions/upload-artifact@v4
              with:
                  name: xyo-${{ matrix.label }}
                  path: target/release/xyo
                  if-no-files-found: error

            - name: Upload artifact (Windows)
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: xyo-${{ matrix.label }}
                  path: target/release/xyo-windows.zip
                  if-no-files-found: error

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download artifact (Linux)
              uses: actions/download-artifact@v4
              with:
                  name: xyo-ubuntu-latest
                  path: ./artifacts/linux

            - name: Download artifact (macOS)
              uses: actions/download-artifact@v4
              with:
                  name: xyo-macos-latest
                  path: ./artifacts/macos

            - name: Download artifact (Windows)
              uses: actions/download-artifact@v4
              with:
                  name: xyo-windows-latest-x64
                  path: ./artifacts/windows

            - name: Download artifact (Windows ARM64)
              uses: actions/download-artifact@v4
              with:
                  name: xyo-windows-11-arm64
                  path: ./artifacts/windows-arm64

            - name: Rename artifacts
              run: |
                  mv ./artifacts/linux/xyo-linux.tar.gz ./artifacts/xyo-linux.tar.gz
                  mv ./artifacts/macos/xyo ./artifacts/xyo-macos
                  mv ./artifacts/windows/xyo-windows.zip ./artifacts/xyo-windows.zip
                  mv ./artifacts/windows-arm64/xyo-windows.zip ./artifacts/xyo-windows-arm64.zip

            - name: Create GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG_NAME=${GITHUB_REF#refs/tags/}
                  gh release create "$TAG_NAME" ./artifacts/xyo-linux.tar.gz ./artifacts/xyo-macos ./artifacts/xyo-windows.zip ./artifacts/xyo-windows-arm64.zip --title "$TAG_NAME" --notes "Automated release for $TAG_NAME"
