name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21.1.x
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1"

      - name: Export LLVM env
        shell: bash
        run: |
          echo "LLVM_SYS_211_PREFIX=${{ steps.llvm.outputs.llvm-path }}" >> "$GITHUB_ENV"
          echo "${{ steps.llvm.outputs.llvm-path }}/bin" >> "$GITHUB_PATH"

      - name: Verify LLVM version
        run: llvm-config --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose
