name: build

on:
    push:
    pull_request:

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                    - name: windows-arm64
                      os: windows-latest
                      target: aarch64-pc-windows-msvc
                    - name: macos-arm64
                      os: macos-14
                      target: aarch64-apple-darwin
                    - name: linux-x86_64
                      os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - name: linux-arm64
                      os: ubuntu-22.04
                      target: aarch64-unknown-linux-gnu

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            # ---------- LLVM install (Linux) ----------
            - name: Install LLVM 18 (Linux)
              if: ${{ startsWith(matrix.os, 'ubuntu') }}
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y wget gpg lsb-release software-properties-common
                  wget https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh 18
                  /usr/bin/llvm-config-18 --version

            # ---------- LLVM install (macOS) ----------
            - name: Install LLVM 18 (macOS)
              if: ${{ startsWith(matrix.os, 'macos') }}
              shell: bash
              run: |
                  brew update
                  brew install llvm@18
                  /opt/homebrew/opt/llvm@18/bin/llvm-config --version

            # ---------- LLVM install (Windows) ----------
            - name: Install LLVM 18 (Windows)
              if: ${{ startsWith(matrix.os, 'windows') }}
              shell: pwsh
              run: |
                  choco install llvm --version=18.1.8 -y --no-progress
                  $llvmConfig = "C:\Program Files\LLVM\bin\llvm-config.exe"
                  if (!(Test-Path $llvmConfig)) {
                    Write-Error "llvm-config.exe not found at $llvmConfig"
                    exit 1
                  }
                  & $llvmConfig --version

            - name: Install Linux cross toolchain
              if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

            # ---------- Build Windows ----------
            - name: Build (Windows)
              if: ${{ startsWith(matrix.os, 'windows') }}
              shell: pwsh
              env:
                  LLVM_SYS_181_PREFIX: C:\Program Files\LLVM
                  LLVM_CONFIG_PATH: C:\Program Files\LLVM\bin\llvm-config.exe
              run: |
                  $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
                  cargo --version
                  & "$env:LLVM_CONFIG_PATH" --version
                  cargo build --release --target ${{ matrix.target }}

            # ---------- Build Linux ----------
            - name: Build (Linux)
              if: ${{ startsWith(matrix.os, 'ubuntu') }}
              shell: bash
              env:
                  LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
                  LLVM_CONFIG_PATH: /usr/bin/llvm-config-18
                  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
                  CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
              run: |
                  export PATH="/usr/lib/llvm-18/bin:$PATH"
                  cargo --version
                  "$LLVM_CONFIG_PATH" --version
                  cargo build --release --target ${{ matrix.target }}

            # ---------- Build macOS ----------
            - name: Build (macOS)
              if: ${{ startsWith(matrix.os, 'macos') }}
              shell: bash
              env:
                  LLVM_SYS_181_PREFIX: /opt/homebrew/opt/llvm@18
                  LLVM_CONFIG_PATH: /opt/homebrew/opt/llvm@18/bin/llvm-config
              run: |
                  export PATH="/opt/homebrew/opt/llvm@18/bin:$PATH"
                  cargo --version
                  "$LLVM_CONFIG_PATH" --version
                  cargo build --release --target ${{ matrix.target }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: scratch-native-runtime-${{ matrix.target }}
                  path: target/${{ matrix.target }}/release/scratch-native-runtime*
                  if-no-files-found: error
