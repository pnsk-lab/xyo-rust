[package]
name = "xyo-rust"
version = "0.0.0-pre22"
edition = "2024"
build = "build.rs"
authors = ["Scratch Native Runtime Contributors"]
description = "A native Scratch project runtime that compiles .sb3 files to native code via LLVM"
license = "MIT"
repository = "https://github.com/pnsk-lab/xyo-rust"
readme = "README.md"
keywords = ["scratch", "llvm", "jit", "compiler", "runtime"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "xyo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.16"
serde_repr = "0.1.20"
zip = "8.1.0"
inkwell = { version = "0.9.0", default-features = false, features = ["llvm21-1"] }
llvm-sys = "211.0.0"
num-bigint = { version = "0.4.6", features = ["rand"] }
ryu-js = "1.0.2"
libc = "0.2"
