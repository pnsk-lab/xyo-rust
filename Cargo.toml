[package]
name = "xyo-rust"
version = "0.1.0"
edition = "2024"
authors = ["Scratch Native Runtime Contributors"]
description = "A native Scratch project runtime that compiles .sb3 files to native code via LLVM"
license = "MIT"
repository = "https://github.com/pnsk-lab/xyo-rust"
readme = "README.md"
keywords = ["scratch", "llvm", "jit", "compiler", "runtime"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "xyo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
inkwell = { version = "0.8.0", default-features = false, features = ["llvm21-1", "llvm21-1-prefer-dynamic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.16"
serde_repr = "0.1.20"
zip = "8.1.0"
